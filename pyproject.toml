[project]
name = "ai-teacher-intelligence-app"
version = "3.0.0"
description = "AI-powered teacher productivity and student performance intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.16,<2.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "PyJWT>=2.10,<3.0",
  "google-genai>=2.0.0,<3.0",
  "Pillow>=11.3,<12.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
